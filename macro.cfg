# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#     M A C R O S   ·   E N D E R   3   V 2
#     ───────────────────────────────────────────────────────────────────
#     START_PRINT  ·  END_PRINT  ·  PAUSE / RESUME
#     LOAD_FILAMENT  ·  UNLOAD_FILAMENT  ·  FILAMENT_CHANGE
#     G29 (home + mesh + park)
#
#     OrcaSlicer hooks:  start gcode = START_PRINT   end gcode = END_PRINT
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Adds print macros such as start print and end print.
# in OrcaSlicer, as start gcode you can define "START_PRINT" and end gcode "END_PRINT"


#=====================================================
# START PRINT
#=====================================================

# Replace the slicer's custom start and end g-code scripts with
# START_PRINT and END_PRINT.

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}

# Per-material pressure advance. These are direct-drive Sprite Pro STARTING
# points — run TUNING_TOWER once per filament and replace with measured values.
# Slicer must pass MATERIAL=PLA|PETG|ABS|TPU; unknown/absent falls back to PLA.
    {% set MATERIAL = params.MATERIAL|default("PLA")|string|upper %}
    {% set pa = {'PLA': 0.038, 'PETG': 0.055, 'ABS': 0.040, 'TPU': 0.020}.get(MATERIAL, 0.038) %}
    SET_PRESSURE_ADVANCE ADVANCE={pa}
    M118 {MATERIAL}: pressure_advance set to {pa}

# Start bed heating (but don't wait for it)
    M140 S{BED_TEMP}

# Use absolute coordinates
    G90

# Reset the G-Code Z offset (adjust Z offset if needed)
    SET_GCODE_OFFSET Z=0.0

# Home the printer
    G28

# Wait for bed to reach temperature
    M190 S{BED_TEMP}

    
# Lift to a safe clearance before meshing (BED_MESH_CALIBRATE re-homes Z via
# the probe, so the old `G1 Z0.15` here did nothing and was removed).
    G1 Z5 F3000

#BUILD MESH

    #G28 ; Home all axes

    BED_MESH_CALIBRATE
    #BED_MESH_PROFILE LOAD=default

 #SMART PARK - Wait for nozzle temperature close to print area
    Smart_Park
    
 # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP} 

# Prime line
    LINE_PURGE
    M117 Whooo were FUCKING Printing...


#=====================================================
# END PRINT
#=====================================================

[gcode_macro END_PRINT]
gcode:
    # move z up
    G91
    G1 E-3 Z+20 F3000
    # absolute xy 
    G90
    G1 X0 Y220 F2000
    #disable hotend and heated bed - turn off cooling fan
    M104 S0
    M140 S0
    M106 S0  
    # disable steppers
    M84
    # Set bed to 0C (off) - Set Hot-end to 0C (off)
    M104 S0 
    M140 S0 

    M117 Print Finished
    BED_MESH_CLEAR


#=====================================================
# SPOOLMAN
#=====================================================

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}
  
#=====================================================
# PID TUNING
#=====================================================

[gcode_macro PID_EXTRUDER]
description: PID Tune for the Extruder
gcode:
  {% set TARGET_TEMP = params.TARGET_TEMP|default(210)|float %} 
  PID_CALIBRATE HEATER=extruder TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS
  SAVE_CONFIG
 
[gcode_macro PID_BED]
description: PID Tune for the Bed
gcode:
  {% set TARGET_TEMP = params.TARGET_TEMP|default(60)|float %} 
  PID_CALIBRATE HEATER=heater_bed TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS
  SAVE_CONFIG
[gcode_macro CHECK_MESH]
gcode:
    {% set ns = namespace(min_point = printer.bed_mesh.probed_matrix[0][0] ,max_point = printer.bed_mesh.probed_matrix[0][0]) %}

    {% for data_row in printer.bed_mesh.probed_matrix %}
        {% for probe_point in data_row %}
            {% if ns.min_point > probe_point %}
                {% set ns.min_point =  probe_point %}
            {% endif %}
            {% if ns.max_point < probe_point %}
                {% set ns.max_point =  probe_point %}
            {% endif %}
        {% endfor %}
    {% endfor %}

    { action_respond_info( "Mesh delta : " + (ns.max_point - ns.min_point) | string)}
    {% if ns.max_point - ns.min_point > params.THRESHOLD|default(0.3)|float %}
        { action_respond_info("Mesh Error!")}
        ;CANCEL_PRINT
    {% else %}
        { action_respond_info("Mesh OK!")}
    {% endif %}

#=====================================================
# BED LEVELING MACRO
#=====================================================

[gcode_macro BED_LEVELING]
description: Heats bed and starts process to level the bed with the screws
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %} 
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  G28
  M190 S{BED_TEMP}
  SCREWS_TILT_CALCULATE

#=====================================================
# PARK PRINTER
#=====================================================

# Park toolhead TO
[gcode_macro M125]
gcode:
    SAVE_GCODE_STATE NAME=parking
    M117 Parking toolhead
    G91
    G1 Z10 F600 # move up 10 mm
    G90
    G1 X5 Y225 F4000 # move to park position
    RESTORE_GCODE_STATE NAME=parking

#=====================================================
# LOW TEMP CHECK
#=====================================================

# LOW_TEMP_CHECK checks if there is a setpoint for the  extruder. Untested! 
# - If this setpoint is reached, continue. 
# - If not, heat to setpoint.
# - If no setpoint, heat to parameter T (default@210)
[gcode_macro LOW_TEMP_CHECK]
gcode:
    {% set T_EXTRUDER = params.T_EXTRUDER|default(210) %}
    {% if printer.extruder.target != 0 %} # if there is a setpoint for extruder
        {% if printer.extruder.temperature < printer.extruder.target %} # if not reached, heat
            M118 Heating from {printer.extruder.temperature} to {printer.extruder.target}.
            M109 S{printer.extruder.target|float} 
        {% endif %}
    {% else %} # if no setpoint for extruder
        {% if printer.extruder.target < T_EXTRUDER %}  # heat to T.
            M118 No setpoint, heating to {T_EXTRUDER}.
            M109 S{T_EXTRUDER}
        {% endif %}
    {% endif %}

#======================================================
# LOAD FILAMENT
#======================================================

[gcode_macro LOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=loading_filament
    M117 Loading Filament
    M83
    G92 E0.0
    LOW_TEMP_CHECK
    G1 E50 F200  # some extra to prime the nozzle --> slower 
    G92 E0.0
    RESTORE_GCODE_STATE NAME=loading_filament


#======================================================
# UNLOAD FILAMENT
#======================================================

[gcode_macro UNLOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=unloading_filament
    M125 # park
    M117 Unloading Filament 
    LOW_TEMP_CHECK
    G91 # set relative
    G1 E10 F100 
    G92 E0.0
    G1 E-50 F200 # the E is the length of the bowden tube (420mm) + 100 mm. 
    G92 E0.0
    RESTORE_GCODE_STATE NAME=unloading_filament
 

#======================================================
# FILAMENT CHANGE
#======================================================

[gcode_macro M600]
gcode:
    M117 Filament Change
    M118 Filament Change
    SAVE_GCODE_STATE NAME=filament_change
    PAUSE
    LOW_TEMP_CHECK
    G91 # relative
    G1 E-1 F300 # retract 1
    M125 # park
    G1 E-350 F4000
    RESTORE_GCODE_STATE NAME=filament_change

#======================================================
# COUNTDOWN MACRO
#======================================================

[gcode_macro COUNTDOWN]
gcode:
    {% set MSG = params.MSG|default("Time: ") %}
    {% set TIME = params.TIME|default(10) %}
    # countdown 
    {% for s in range(TIME|int, 0, -1) %}
        # dwell 1 second
        G4 P1000
        # echo
        M117 {params.MSG} {s}s
        M118 {params.MSG} {s}s
    {% endfor %}
[gcode_macro Z_PROBE_CALIBRATE]

gcode:
      {% set BED_TEMP = params.BED_TEMP|default(60)|float %} 
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
      G28
      M190 S{BED_TEMP}
      PROBE_CALIBRATE

#=====================================================
# PREHEATS
#=====================================================

[gcode_macro PREHEAT_PLA]
description: Preheats extruder and bed for PLA printing, extruder set to 150 to prevent filament leaking while homing etc
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(150)|float %}
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}

[gcode_macro PREHEAT_ABS]
description: Preheats extruder and bed for ABS printing, extruder set to 180 to prevent filament leaking while homing etc
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(180)|float %}
  {% set BED_TEMP = params.BED_TEMP|default(80)|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}

[gcode_macro PREHEAT_PETG]
description: Preheats extruder and bed for PETG printing, extruder set to 170 to prevent filament leaking while homing etc
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(170)|float %}
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}

[gcode_macro PREHEAT_BED_ONLY]
description: Preheats extruder and bed for PETG printing, extruder set to 170 to prevent filament leaking while homing etc
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(170)|float %}
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}

[gcode_macro COOL]
description: Turns off all heaters
gcode:
  TURN_OFF_HEATERS


#=====================================================
# UTILITY MACROS
#=====================================================

[gcode_macro CG28]
description: Home only if not already homed - saves time
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


#=====================================================
# PRINT TIME/PROGRESS DISPLAY
#=====================================================

[gcode_macro M73]
description: Set print progress percentage for display
rename_existing: M73.1
gcode:
    M73.1 P{params.P|default(0)}
    M117 {params.P|default(0)}% Complete


#=====================================================
# HEAT SOAK
#=====================================================

[gcode_macro HEAT_SOAK]
description: Heat bed and wait for thermal stabilization
gcode:
    {% set TEMP = params.TEMP|default(60)|float %}
    {% set DURATION = params.DURATION|default(10)|int %}
    M117 Heating bed to {TEMP}C...
    M140 S{TEMP}
    M190 S{TEMP}
    M117 Heat soaking for {DURATION} min...
    G4 P{DURATION * 60 * 1000}
    M117 Heat soak complete
